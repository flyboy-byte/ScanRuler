# SPDX-License-Identifier: AGPL-3.0-only
# All original checks remain mandatory. Independent lanes preserve diagnostics
# when source unit timing tests fail; no retries, filters or threshold changes.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash # Explicit shell enables pipefail; tee must not mask a failed gate.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plugin boundary
        run: node scripts/check-plugin-boundary.mjs
      - name: Display units
        run: node scripts/check-units.mjs
      - name: Complete original unit suite
        run: |
          mkdir -p e2e-out/source-tests
          # Avoid competing test files inside this timing-sensitive VM.
          # Every source test and its original time/accuracy assertions still run.
          npm test -- --maxWorkers=1 --minWorkers=1 --no-file-parallelism 2>&1 | tee e2e-out/source-tests/unit-tests.log
      - name: Retain source unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-unit-tests-${{ github.sha }}
          path: e2e-out/source-tests/
          if-no-files-found: warn
          retention-days: 30
  source-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm --prefix mcp ci
      - name: Complete original agent suite
        run: |
          mkdir -p e2e-out/source-mcp
          npm --prefix mcp test 2>&1 | tee e2e-out/source-mcp/tests.log
      - name: Retain agent diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-mcp-${{ github.sha }}
          path: e2e-out/source-mcp/
          if-no-files-found: warn
          retention-days: 30
  source-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix mcp ci
      - run: npm run build
      - name: Complete browser regression and production smoke suites
        run: npm run e2e:ci
      - name: Retain browser diagnostics (including successful runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-browser-${{ github.sha }}
          path: e2e-out/ci/
          if-no-files-found: warn
          retention-days: 30
  test-and-build:
    if: always()
    needs: [source-tests, source-mcp, source-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All original checks must succeed
        env:
          TESTS: ${{ needs.source-tests.result }}
          MCP: ${{ needs.source-mcp.result }}
          BROWSER: ${{ needs.source-browser.result }}
        run: |
          test "$TESTS" = success
          test "$MCP" = success
          test "$BROWSER" = success
