name: Plan and status integrity (not parity)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Source-map proof tests inspect the immutable original Git tree.
          fetch-depth: 0
      - run: python3 docs/port-plan/tools/port_plan.py --root docs/port-plan check-generated
      - run: python3 docs/port-plan/tools/port_plan.py selftest
      - run: python3 docs/port-plan/tools/ci_report.py status --check
      - run: python3 -m unittest discover -s docs/port-plan/tools -p 'test_*.py'
