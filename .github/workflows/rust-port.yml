# SPDX-License-Identifier: AGPL-3.0-only
# Separate fast checks, actual native source assertions and source-catalog contracts.
# None of these implement browser-Wasm parity or the P37 exact-base numerical ratchet.
name: Rust port validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash # Explicit shell enables pipefail; tee must not mask a failed gate.
concurrency:
  group: rust-port-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hosted toolchain and Wasm compile target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Fast gate (no native oracle execution)
        working-directory: rust
        run: |
          mkdir -p target/ci
          cargo xtask env | tee target/ci/environment.txt
          cargo xtask ci 2>&1 | tee target/ci/fast.log
      - name: Retain fast diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fast-${{ github.sha }}
          path: rust/target/ci/
          if-no-files-found: error
          retention-days: 30
  native-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hosted native toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run every required native source suite
        working-directory: rust
        run: |
          mkdir -p target/ci
          cargo xtask env | tee target/ci/environment.txt
          cargo xtask oracle 2>&1 | tee target/ci/native-oracle.log
      - name: Verify exact-run raw evidence inventory
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 docs/port-plan/tools/ci_report.py evidence --candidate "$CANDIDATE_SHA"
      - name: Retain every suite and evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ github.sha }}
          path: |
            rust/target/*-diff/
            rust/target/ci/
          if-no-files-found: error
          retention-days: 30
  catalog-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Negative validators and immutable captured snapshots
        run: node --test docs/port-plan/oracle/catalog-contract.test.mjs docs/port-plan/oracle/browser-catalog-contract.test.mjs
  browser-wasm:
    needs: [native-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hosted Rust Wasm toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Original browser-driver dependency (oracle tooling only)
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: native-source-${{ github.sha }}
          path: rust/target
      - name: Build safe private test ABI (not the product ABI)
        working-directory: rust
        run: cargo xtask wasm-probe
      - name: Comparator negative tests
        run: node --test docs/port-plan/oracle/browser-wasm-contract.test.mjs
      - name: Execute Rust Wasm in real Chrome and compare all declared inputs
        run: node docs/port-plan/oracle/run-browser-wasm.mjs
      - name: Retain module identity, complete raw outputs and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-wasm-${{ github.sha }}
          path: |
            rust/target/browser-wasm/
            rust/target/wasm32-unknown-unknown/debug/port_wasm_probe.wasm
            rust/target/wasm32-unknown-unknown/debug/port_wasm_probe.candidate.txt
            rust/target/wasm32-unknown-unknown/debug/port_wasm_probe.rustc.txt
          if-no-files-found: error
          retention-days: 30
  gate:
    if: always()
    needs: [fast, native-oracle, catalog-contracts, browser-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every required lane must succeed
        env:
          FAST: ${{ needs.fast.result }}
          NATIVE: ${{ needs.native-oracle.result }}
          CATALOG: ${{ needs.catalog-contracts.result }}
          BROWSER_WASM: ${{ needs.browser-wasm.result }}
        run: |
          test "$FAST" = success
          test "$NATIVE" = success
          test "$CATALOG" = success
          test "$BROWSER_WASM" = success
