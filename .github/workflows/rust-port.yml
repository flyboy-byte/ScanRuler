# SPDX-License-Identifier: AGPL-3.0-only
# Fast product gate for the Rust port: fmt, clippy, tests, wasm32 check and the plan
# checks, all through `cargo xtask ci`. This is NOT the parity gate: the differential
# suites against the original (`cargo xtask diff-ci`) do not exist yet, so a green run
# here proves the fast checks only. A separate step compares the binary STL helper
# against the frozen original; it does not establish whole-product parity. See
# docs/port-plan/CI-AND-REGRESSIONS.md and repo-bootstrap/.github/workflows/port-gate.yml.example.
name: Rust port (fast gate)
on:
  pull_request:
    paths: ['rust/**', 'docs/port-plan/**', '.github/workflows/rust-port.yml']
  push:
    branches: [main]
    paths: ['rust/**', 'docs/port-plan/**', '.github/workflows/rust-port.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-port-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # the frozen source commit is the STL comparison oracle
      - name: Toolchain and wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Environment record
        working-directory: rust
        run: cargo xtask env
      - name: Fast gate
        working-directory: rust
        run: cargo xtask ci
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Binary STL pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-io --test binary_stl pinned_original_comparison -- --ignored --nocapture
      - name: Full STL dispatch pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-io --test stl_dispatch pinned_stl_dispatch_comparison -- --ignored --nocapture
      - name: Retain raw binary STL comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-stl-comparison
          path: rust/target/stl-diff/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain raw STL dispatch comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stl-dispatch-comparison
          path: rust/target/stl-dispatch-diff/
          if-no-files-found: warn
          retention-days: 7
      - name: Exact-bit welding pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test weld pinned_weld_comparison -- --ignored --nocapture
      - name: Retain welding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-weld-comparison
          path: rust/target/weld-diff/
          retention-days: 7
      - name: Vertex normals pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test normals pinned_normals_comparison -- --ignored --nocapture
      - name: Retain vertex normal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertex-normal-comparison
          path: rust/target/normals-diff/
          retention-days: 7
      - name: Mesh orientation pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test orientation pinned_orientation_comparison -- --ignored --nocapture
      - name: Retain orientation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-orientation-comparison
          path: rust/target/orientation-diff/
          retention-days: 7
      - name: Dense solver pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test linear pinned_linear_comparison -- --ignored --nocapture
      - name: Retain solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linear-solver-comparison
          path: rust/target/linear-diff/
          retention-days: 7
      - name: Fixed-selection plane pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test plane pinned_plane_comparison -- --ignored --nocapture
      - name: Retain plane fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plane-fit-comparison
          path: rust/target/plane-diff/
          retention-days: 7
      - name: Clipped plane pinned-original comparison (native)
        working-directory: rust
        run: cargo test -p port-core --test clip pinned_clip_comparison -- --ignored --nocapture
      - name: Retain clipping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plane-clipping-comparison
          path: rust/target/clip-diff/
          retention-days: 7
